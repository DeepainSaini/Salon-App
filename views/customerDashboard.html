<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="/css/customerDashboard.css">
</head>
<body>
    <div class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1></h1>
                <p>Browse salon services and book your appointment</p>
            </div>

            <div class="account-menu">
                <button id="account-menu-btn" class="account-menu-btn">
                    Account
                </button>

                <div id="account-dropdown" class="account-dropdown">
                    <a href="/user/profile/edit">Edit Profile</a>
                    <a href="/user/change-password">Change Password</a>
                    <button id="logout-btn">Logout</button>
                </div>
            </div>
        </header>

        <section class="salons-section">
            <h2>Available Salons</h2>
            <div class="salon-search-box">
                <input type="text" id="salon-search-input" placeholder="Search salon by name">
                <button id="salon-search-btn">Search</button>
                <button id="clear-search-btn">Clear</button>
            </div>
            <div id="salons-list" class="salons-list">
                
            </div>
        </section>

        <section class="appointments-section">
            <h2>My Appointments</h2>

            <div id="appointments-list" class="appointments-list">
                
            </div>
        </section>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.9.0/axios.min.js"></script>
    <script src="/js/customerDashboard.js"></script>
</body>
</html>
