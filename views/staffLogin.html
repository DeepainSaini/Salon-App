<!DOCTYPE html>
<html>
<head>
  <title>Staff Login</title>
  <link rel="stylesheet" href="/css/staffLogin.css">
</head>
<body>

  <div class="staff-login-container">
    <h2>Staff Login</h2>

    <form id="staff-login-form">
      <input type="email" id="email" placeholder="Staff email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p class="link">Customer Or Admin Login? <a href="/user/login">Login</a></p>
  </div>

  

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/staffLogin.js"></script>
</body>
</html>
